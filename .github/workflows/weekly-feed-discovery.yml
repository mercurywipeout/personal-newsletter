name: Weekly Feed Discovery

on:
  schedule:
    # Sundays at 15:00 UTC (same clock as the daily newsletter)
    - cron: "0 15 * * 0"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      day:
        description: "Cluster date to analyse (YYYY-MM-DD, defaults to today)"
        required: false
        default: ""
      auto_add:
        description: "Auto-add top candidates to feeds list (true/false)"
        required: false
        default: "false"

jobs:
  discover-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feed discovery
        env:
          INPUT_DAY: ${{ github.event.inputs.day }}
          INPUT_AUTO_ADD: ${{ github.event.inputs.auto_add || 'true' }}
        run: |
          CMD="python -m discovery.recommend_feeds"
          [ -n "$INPUT_DAY" ] && CMD="$CMD --day $INPUT_DAY"
          [ "$INPUT_AUTO_ADD" = "true" ] && CMD="$CMD --auto-add"
          $CMD
