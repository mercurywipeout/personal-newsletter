name: Daily AI & Tech Newsletter

on:
  schedule:
    # Target ~7:30 AM PT. GitHub's scheduler typically runs 30–55 min late,
    # so 14:00 UTC lands around 7:30–7:55 AM PDT (Mar–Nov, UTC-7).
    # In winter PST (UTC-8) this becomes ~6:30–7:00 AM — adjust to "0 15 * * *" if preferred.
    - cron: "0 14 * * *"

  # Allow manual trigger from GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # needed to push runtime state back to the repo

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send newsletter
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
        run: python daily_newsletter.py

      - name: Commit runtime state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_stories.json data/feeds.json data/feed_stats_daily.json data/runs/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update runtime state [skip ci]"
          git push
