name: Daily AI & Tech Newsletter

on:
  schedule:
    # 7:00 AM Pacific Standard Time (UTC-8) = 15:00 UTC
    # Note: shifts to 8 AM PT during daylight saving time (Mar–Nov)
    # Change to "0 14 * * *" for summer if preferred
    - cron: "0 15 * * *"

  # Allow manual trigger from GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore seen-stories cache
        uses: actions/cache@v4
        with:
          path: seen_stories.json
          key: seen-stories-${{ github.run_id }}
          restore-keys: |
            seen-stories-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send newsletter
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
        run: python daily_newsletter.py
